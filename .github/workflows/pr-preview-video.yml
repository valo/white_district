name: PR Playwright Preview Video

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Pick relevant preview tag
        id: pick
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const names = files.map(f => f.filename)

            const feeRelated = names.some((n) =>
              n.endsWith('.xlsx') ||
              n === 'src/data/offers.json' ||
              n === 'scripts/parse_excel.py'
            )

            const tag = feeRelated ? '@fees' : '@unit-picker'
            core.setOutput('tag', tag)
            core.info(`Changed files: ${names.join(', ')}`)
            core.info(`Selected preview tag: ${tag}`)

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Run relevant preview test with video
        run: PW_VIDEO=1 pnpm exec playwright test --grep "@preview.*${{ steps.pick.outputs.tag }}"

      - name: Upload preview video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-video-${{ steps.pick.outputs.tag }}
          path: |
            test-results/**/video.webm
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Comment PR with preview run link
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.pick.outputs.tag }}`
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `🎬 Playwright preview (${tag}) is ready.`,
              '',
              `Open this run and download artifact: **playwright-preview-video-${tag}**`,
              runUrl,
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            })
